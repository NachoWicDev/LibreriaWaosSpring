# spring.application.name=libreria_waos_spring

# Conexion mysql
spring.datasource.url=jdbc:mysql://localhost:3306/libreria_waos_v2
spring.datasource.username=root
spring.datasource.password=*********
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Evitar que se cree el esquema de bd
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
    # Despliega el detalle de cada sentencia SQL

# Desactivar tomcat (es un servidor de aplicaciones para desplegar aplicaciones web)
spring.main.web-application-type=none